plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id("kotlin-kapt")
    id 'com.google.dagger.hilt.android'
}

kapt {
    correctErrorTypes = true
    useBuildCache = true
    arguments {
        arg("room.incremental", "true")
    }
}

Properties localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// These are configuration values, not provider credentials. The Gemini secret stays on the backend.
def geminiBackendUrl = localProperties.getProperty("GEMINI_BACKEND_URL") ?: System.getenv("GEMINI_BACKEND_URL") ?: ""
def escapedGeminiBackendUrl = geminiBackendUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
        .replace("\r", "")
        .replace("\n", "")

def releaseStoreFile = localProperties.getProperty("RELEASE_STORE_FILE") ?: System.getenv("RELEASE_STORE_FILE") ?: ""
def releaseStorePassword = localProperties.getProperty("RELEASE_STORE_PASSWORD") ?: System.getenv("RELEASE_STORE_PASSWORD") ?: ""
def releaseKeyAlias = localProperties.getProperty("RELEASE_KEY_ALIAS") ?: System.getenv("RELEASE_KEY_ALIAS") ?: ""
def releaseKeyPassword = localProperties.getProperty("RELEASE_KEY_PASSWORD") ?: System.getenv("RELEASE_KEY_PASSWORD") ?: ""
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

if (hasReleaseSigning) {
    android.signingConfigs {
        production {
            storeFile file(releaseStoreFile)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }
}

android {
    namespace 'com.example.nhatkyduonghuyet'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.nhatkyduonghuyet"
        minSdk 24
        targetSdk 36
        versionCode (System.getenv("ANDROID_VERSION_CODE") ?: localProperties.getProperty("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName System.getenv("ANDROID_VERSION_NAME") ?: localProperties.getProperty("ANDROID_VERSION_NAME") ?: "1.0.0"

        buildConfigField "String", "GEMINI_BACKEND_URL", "\"${escapedGeminiBackendUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.production
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    // Refuse an unsigned release build instead of silently producing a debug-signed production artifact.
    gradle.taskGraph.whenReady { taskGraph ->
        def isReleaseTask = taskGraph.allTasks.any { task ->
            task.name.toLowerCase(Locale.ROOT).contains("release")
        }
        if (isReleaseTask && !hasReleaseSigning) {
            throw new GradleException(
                    "Production signing is not configured. Set RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, " +
                            "RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD before running a release task."
            )
        }
    }

    // Optimization: Split APKs per architecture to reduce download size.
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    aaptOptions {
        noCompress "tflite"
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

kotlin {
    jvmToolchain(17)
}

hilt {
    enableAggregatingTask = true
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.3"
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation "com.google.dagger:hilt-android:2.51"
    kapt "com.google.dagger:hilt-compiler:2.51"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "com.patrykandpatrick.vico:compose:1.13.1"
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:2.16.1'

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.2.1"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
}
