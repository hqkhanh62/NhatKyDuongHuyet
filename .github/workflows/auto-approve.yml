name: Auto Approve PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # Chỉ tự động phê duyệt nếu PR được tạo bởi chính chủ (hqkhanh62) hoặc bot hệ thống
    if: github.actor == 'hqkhanh62' || github.actor == 'dependabot[bot]'
    steps:
      - name: Approve PR
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
