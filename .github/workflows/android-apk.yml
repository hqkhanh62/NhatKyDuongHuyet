name: Android APK CI

on:
  workflow_dispatch:
    inputs:
      web_app_url:
        description: "Public HTTPS URL of deployed web app"
        required: true
        type: string
  push:
    branches:
      - main
      - master
      - capnhat_baomat

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WEB_APP_URL: ${{ github.event.inputs.web_app_url || vars.WEB_APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate WEB_APP_URL
        run: |
          if [ -z "${WEB_APP_URL}" ]; then
            echo "WEB_APP_URL is missing. Set workflow input web_app_url or repo variable WEB_APP_URL"
            exit 1
          fi
          if [[ ! "${WEB_APP_URL}" =~ ^https:// ]]; then
            echo "WEB_APP_URL must start with https://"
            exit 1
          fi

      - name: Generate Android project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhatkyduonghuyet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
