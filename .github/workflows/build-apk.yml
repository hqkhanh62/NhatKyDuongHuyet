name: Build Android APK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Prepare APKs for Upload
        shell: bash
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          APK_DIR="app/build/outputs/apk/debug"
          shopt -s nullglob
          APK_FILES=("${APK_DIR}"/*.apk)

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "No APK files found in ${APK_DIR}"
            exit 1
          fi

          for apk in "${APK_FILES[@]}"; do
            basename=$(basename "${apk}")
            mv "${apk}" "${APK_DIR}/${COMMIT_ID}-${basename}"
          done

          echo "Prepared APK files:"
          find "${APK_DIR}" -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NhatKyDuongHuyet-PRO-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
