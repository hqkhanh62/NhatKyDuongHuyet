name: Build Android APK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Rename APK with Commit ID and Date
      run: |
        COMMIT_ID=$(git rev-parse --short HEAD)
        DATE=$(date +'%Y%m%d_%H%M')
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NhatKyDuongHuyet_${DATE}_${COMMIT_ID}.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NhatKyDuongHuyet-APK
        path: app/build/outputs/apk/debug/*.apk
